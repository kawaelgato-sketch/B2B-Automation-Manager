<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Automation Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Écran de démarrage START */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }
        #start-btn {
            color: #fff;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            border: 2px solid #fff;
            padding: 20px 50px;
            background: transparent;
            transition: 0.3s;
        }
        #start-screen:hover #start-btn {
            background: #fff;
            color: #000;
        }

        /* Contenu multimédia caché au départ */
        #media-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            z-index: 10;
        }
        #media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Écran Start -->
    <div id="start-screen" onclick="launchSystem()">
        <div id="start-btn">START</div>
    </div>

    <!-- Contenu multimédia en arrière-plan -->
    <div id="media-container">
        <!-- GIF en boucle -->
        <img src="https://media.giphy.com/media/rzZRvD4cKRwwwDnAg3B/giphy.gif" alt="Animation">
        
        <!-- Audio en boucle -->
        <audio id="bg-audio" loop>
            <!-- Remplace par le lien direct de ton fichier audio ou un fichier local hébergé -->
            <source src="prince of egypt. (Jersey Club) SLOWED + REVERB [@fazobeats].mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        function launchSystem() {
            // Masquer l'écran Start
            document.getElementById('start-screen').style.display = 'none';
            
            // Afficher le contenu
            document.getElementById('media-container').style.display = 'block';
            
            // Lancer la musique
            var audio = document.getElementById('bg-audio');
            audio.play().catch(error => console.log("Audio bloqué par le navigateur :", error));
            
            // Déclenchement automatique de l'action GitHub en arrière-plan via fetch (requête API GitHub)
            // Remplace TON_PSEUDO par ton vrai pseudo GitHub
            const token = ""; // Optionnel si public, mais l'idéal est de passer par le bouton direct si l'API demande une authentification stricte.
            
            // Redirection transparente ou ouverture de l'action GitHub si besoin, 
            // ou appel de l'API de dispatch GitHub Actions :
            fetch('https://api.github.com/repos/TON_PSEUDO/B2B-Automation-Manager/actions/workflows/run_bot.yml/dispatches', {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ref: 'main' })
            }).then(response => {
                console.log("Signal de lancement envoyé au cloud !");
            }).catch(err => {
                console.log("Erreur de dispatch, mais l'ambiance est là.");
            });
        }
    </script>
</body>
</html>
