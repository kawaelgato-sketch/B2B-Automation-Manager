<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Automation Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }
        #start-btn {
            color: #fff;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 5px;
            font-family: monospace;
            border: 2px solid #fff;
            padding: 20px 50px;
            background: transparent;
            transition: 0.2s;
        }
        #start-screen:hover #start-btn {
            background: #fff;
            color: #000;
        }

        #media-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            z-index: 10;
            background: #000;
        }
        #media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="startSystem()">
        <div id="start-btn">START</div>
    </div>

    <div id="media-container">
        <!-- GIF en boucle -->
        <img src="rzZRvD4cKRwwwDnAg3B.gif" alt="Animation">
        
        <!-- Audio en boucle -->
        <audio id="bg-audio" loop>
            <source src="prince of egypt. (Jersey Club) SLOWED + REVERB [@fazobeats].mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        function startSystem() {
            // Masquer l'écran Start
            document.getElementById('start-screen').style.display = 'none';
            
            // Afficher le conteneur multimédia
            document.getElementById('media-container').style.display = 'block';
            
            // Lancer la musique
            var audio = document.getElementById('bg-audio');
            audio.play().catch(err => console.log("Lecture audio bloquée :", err));
            
            // Déclenchement automatique de l'action GitHub Actions en arrière-plan
            fetch('https://api.github.com/repos/kawaelgato-sketch/B2B-Automation-Manager/actions/workflows/run_bot.yml/dispatches', {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ref: 'main' })
            }).then(response => {
                console.log("Campagne lancée avec succès dans le cloud.");
            }).catch(err => {
                console.log("Erreur de liaison cloud.");
            });
        }
    </script>
</body>
</html>
